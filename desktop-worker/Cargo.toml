[package]
name = "octendra-desktop-worker"
version = "0.1.2"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
resolver = "3"

[dependencies]
octendra-desktop-protocol = { path = "../crates/octendra-desktop-protocol" }
host = "=2.0.0-alpha.6"
protocol = "=2.0.0-alpha.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.4", features = ["serde", "v4"] }

nix = { version = "0.30.1", features = ["fs"] }

[dev-dependencies]
anyhow = "1.0.103"
fs2 = "0.4.3"
tempfile = "3"
