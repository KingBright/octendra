[package]
name = "octendra-code"
version = "0.12.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
argon2.workspace = true
axum = { workspace = true, features = ["form", "query"] }
base64.workspace = true
clap.workspace = true
cap-std = "3.4.5"
diffy = "0.4.2"
fs2 = "0.4.3"
ignore = "0.4.25"
globset = "0.4.18"
portable-pty = "0.9.0"
regex.workspace = true
reqwest = { workspace = true, features = ["stream"] }
octendra-token-output = { path = "../octendra-token-output" }
octendra-desktop-protocol = { path = "../octendra-desktop-protocol" }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
similar = "2.7.0"
sqlx.workspace = true
subtle = "2.6.1"
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tree-sitter = "0.25.10"
tree-sitter-rust = "0.24.0"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
uuid.workspace = true
url = "2.5.8"
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
octendra-admin = { path = "../octendra-admin" }
screencapturekit = "=1.5.4"
core-graphics = { version = "=0.23.2", features = ["elcapitan", "highsierra"] }
foreign-types = "=0.5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "=0.62.2", features = ["Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_IO", "Win32_System_Performance", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", features = ["signal", "process", "fs", "poll", "user", "term"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
